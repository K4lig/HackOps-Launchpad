name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: { python-version: "3.12" }
      - run: pip install -r apps/api/requirements.txt pytest
      - run: cd apps/api && pytest -q

  sast:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: semgrep scan --config p/default --error

  image-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: docker build -t cve-api:ci apps/api
      - run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy image --exit-code 1 --severity CRITICAL,HIGH
          --ignore-unfixed cve-api:ci

  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: >
          docker run --rm -v "$PWD/infra/terraform:/tf"
          bridgecrew/checkov@sha256:8e63f217cb084f1c1a067326a9cf6e37d54bdc82e5822210d50ca4e2f647dd93
          -d /tf --var-file /tf/terraform.tfvars.example --compact --quiet
