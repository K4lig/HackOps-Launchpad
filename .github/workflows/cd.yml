name: CD

on:
  push:
    branches: [main]
    patch-ignore: ['gitops/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_NAME: acrhackopsdevc3evs
  RESOURCE_GROUP: rg-hackops-dev
  CLUSTER: aks-hackops-dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Construir imagenes
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker build -t "$ACR_NAME.azurecr.io/cve-api:$TAG" apps/api
          docker build -t "$ACR_NAME.azurecr.io/cve-frontend:$TAG" apps/frontend

      - name: Escanear con Trivy
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          for IMG in cve-api cve-frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
              image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
              "$ACR_NAME.azurecr.io/$IMG:$TAG"
          done

      - uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f
        with:
          client-id: ${{ vars.AZURE_BUILD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publicar en ACR
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          az acr login --name "$ACR_NAME"
          docker push "$ACR_NAME.azurecr.io/cve-api:$TAG"
          docker push "$ACR_NAME.azurecr.io/cve-frontend:$TAG"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Empaquetar chart
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: helm package charts/cve-copilot --app-version "$TAG" --destination "$RUNNER_TEMP/chart"

      - uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar con Helm via command invoke
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          cd "$RUNNER_TEMP/chart"
          CHART=$(ls cve-copilot-*.tgz)
          RESULT=$(az aks command invoke \
            -g "$RESOURCE_GROUP" -n "$CLUSTER" \
            --command "helm upgrade --install cve-copilot ./$CHART -n cve-copilot --set image.tag=$TAG --wait --timeout 5m" \
            --file "$CHART" -o json)
          echo "$RESULT" | jq -r '.logs'
          test "$(echo "$RESULT" | jq -r '.exitCode')" = "0"

  update-gitops:
    needs: build
    runs-on: ubuntu-latest
    environment: production        # conserva tu aprobación manual
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Actualizar image.tag en Git
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          yq -i '.image.tag = strenv(TAG)' gitops/cve-copilot/values-dev.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(cve-copilot): $TAG"
          git push
