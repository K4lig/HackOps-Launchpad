apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
  namespace: cve-copilot
data:
  script.js: |
    import http from 'k6/http';
    export const options = { vus: 30, duration: '4m' };
    export default function () {
      http.get('http://frontend:8080/api/cve/carga-de-prueba');
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load
  namespace: cve-copilot
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: k6
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: grafana/k6:latest
          args: ["run", "/scripts/script.js"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: k6-script
