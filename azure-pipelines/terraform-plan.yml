trigger: none

pr:
  branches:
    include:
      - main
  paths:
    include:
      - infra/terraform/*

pool:
  name: Default

variables:
  - group: terraform-plan

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: Terraform plan
    env:
      TF_VAR_admin_ips: $(ADMIN_IPS)
      TF_VAR_budget_email: $(BUDGET_EMAIL)
      TF_VAR_admin_object_id: $(ADMIN_OBJECT_ID)
      TF_VAR_ado_issuer: $(ADO_ISSUER)
      TF_VAR_ado_subject: $(ADO_SUBJECT)
    inputs:
      azureSubscription: azure-hackops-plan
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_TENANT_ID="$tenantId"
        export ARM_OIDC_TOKEN="$idToken"
        export ARM_USE_OIDC=true
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        cd infra/terraform
        terraform init -input=false
        terraform plan -input=false -lock-timeout=5m -no-color \
          -var "tfstate_storage_account=$(grep storage_account_name versions.tf | cut -d'"' -f2)"
