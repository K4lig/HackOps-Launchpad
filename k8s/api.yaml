apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cve-copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: acrhackopsdev23xhf.azurecr.io/cve-api:8940767
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: llm-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cve-copilot
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
